# Weekly check of every resource URL in data/sources.yaml.
#
# Two isolated jobs:
#   scan   - read-only (contents: read). Checks out the repository, runs the network link
#            check and the stale-source report, and uploads a Markdown report artifact.
#   report - issues: write only. Does NOT check out or run repository code. It downloads the
#            report and creates or updates a single tracking issue (no duplicates).
name: Scheduled link check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-link-check
  cancel-in-progress: false

jobs:
  scan:
    name: Scan links (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_problems: ${{ steps.summary.outputs.has_problems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check links and staleness
        id: summary
        run: |
          problems=false
          python scripts/check_links.py --output link-report.md --fail-on-problems || problems=true
          {
            echo ""
            echo "## Stale sources"
            echo ""
            python scripts/report_stale_sources.py --fail-on-stale || problems=true
          } >> link-report.md
          echo "has_problems=${problems}" >> "$GITHUB_OUTPUT"
          cat link-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: link-report
          path: link-report.md
          retention-days: 14

  report:
    name: Update tracking issue
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_PROBLEMS: ${{ needs.scan.outputs.has_problems }}
      ISSUE_TITLE: "Weekly link check: dead, moved, redirected, or stale sources"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: link-report
      - name: Create or update the single tracking issue
        run: |
          existing="$(gh issue list --state open --search "in:title \"${ISSUE_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          if [ "${HAS_PROBLEMS}" = "true" ]; then
            if [ -n "${existing}" ]; then
              gh issue edit "${existing}" --body-file link-report.md
              echo "Updated issue #${existing}"
            else
              gh issue create --title "${ISSUE_TITLE}" --body-file link-report.md
            fi
          elif [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "The latest scheduled check found no dead, moved, or stale sources."
            gh issue close "${existing}"
          else
            echo "No problems found and no open tracking issue."
          fi
