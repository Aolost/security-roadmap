# Link checking for pull requests (network-dependent; never part of the unit tests).
# 403 and 429 are accepted because several training sites use bot protection that blocks
# CI runners while the pages work in a browser. The weekly scheduled check reports these
# separately as "blocked" so a maintainer can recheck them by hand.
accept = ["200..=299", "403", "429"]
max_retries = 2
timeout = 30
exclude_path = ["tests/fixtures", "node_modules"]
include_fragments = false
# The README's "open an issue" link is relative so that it works on any fork; it only
# resolves on GitHub, not as a local file.
exclude = ["issues/new$"]
